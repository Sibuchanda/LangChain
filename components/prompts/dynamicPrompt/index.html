<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Research Tool</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
      }

      .container {
        width: 500px;
        margin: 60px auto;
        background: white;
        padding: 25px;
        border-radius: 8px;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
      }

      button {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        background-color: #2563eb;
        color: white;
        border: none;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #1e40af;
      }

      #output {
        margin-top: 25px;
        white-space: pre-wrap;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Research Tool</h1>

      <label>Research Topic</label>
      <select id="topic">
        <option value="Cryptography">Cryptography</option>
        <option value="Artificial Intelligence">Artificial Intelligence</option>
        <option value="Cyber Security">Cyber Security</option>
        <option value="Blockchain">Blockchain</option>
      </select>

      <label>Explanation Style</label>
      <select id="style">
        <option value="beginner friendly">Beginner Friendly</option>
        <option value="intermediate">Medium</option>
        <option value="advanced">Advanced</option>
      </select>

      <label>Length</label>
      <select id="length">
        <option value="1 line">1 Line</option>
        <option value="2 lines">2 Lines</option>
        <option value="5 paragraphs">5 Paragraphs</option>
        <option value="10 paragraphs">10 Paragraphs</option>
      </select>

      <button onclick="generateResearch()">Generate</button>

      <div id="output"></div>
    </div>

    <script>
      const API_KEY = "AIzaSyDnYZdPgbRopmt1vVkDdWwMVo_5pbXssJE";

      function buildPrompt(topic, style, length) {
        return `
You are an academic research assistant.

Write a ${length} research explanation on the topic "${topic}".
The explanation level should be ${style}.
Maintain a professional, academic tone.
Explain concepts clearly and logically.
Include real-world context where appropriate.
Avoid unnecessary fluff and keep the content precise.
`;
      }

      async function generateResearch() {
        const topic = document.getElementById("topic").value;
        const style = document.getElementById("style").value;
        const length = document.getElementById("length").value;

        const prompt = buildPrompt(topic, style, length);
        document.getElementById("output").innerText = "Generating...";

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [
                  {
                    role: "user",
                    parts: [{ text: prompt }],
                  },
                ],
              }),
            },
          );

          const data = await response.json();

          if (!data.candidates || data.candidates.length === 0) {
            throw new Error("No response from Gemini");
          }

          const result = data.candidates[0].content.parts[0].text;
          document.getElementById("output").innerText = result;
        } catch (error) {
          document.getElementById("output").innerText =
            "Error generating content. Check console.";
          console.error(error);
        }
      }
    </script>
  </body>
</html>
